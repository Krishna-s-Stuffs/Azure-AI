<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="290" fill="#ffffff"/>

  <!-- Regression -->
  <rect x="20" y="20" width="190" height="180" rx="8" fill="#FAFAF8" stroke="#888780" stroke-width="1"/>
  <line x1="45" y1="170" x2="190" y2="170" stroke="#999" stroke-width="1"/>
  <line x1="45" y1="170" x2="45" y2="45" stroke="#999" stroke-width="1"/>
  <circle cx="60" cy="150" r="4" fill="#7F77DD"/>
  <circle cx="80" cy="140" r="4" fill="#7F77DD"/>
  <circle cx="95" cy="120" r="4" fill="#7F77DD"/>
  <circle cx="115" cy="115" r="4" fill="#7F77DD"/>
  <circle cx="130" cy="95" r="4" fill="#7F77DD"/>
  <circle cx="150" cy="85" r="4" fill="#7F77DD"/>
  <circle cx="170" cy="65" r="4" fill="#7F77DD"/>
  <line x1="50" y1="160" x2="180" y2="55" stroke="#D85A30" stroke-width="2"/>
  <text x="115" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#222">Regression</text>
  <text x="115" y="232" text-anchor="middle" font-size="10.5" fill="#666">Predicts a continuous</text>
  <text x="115" y="246" text-anchor="middle" font-size="10.5" fill="#666">numeric value</text>
  <text x="115" y="264" text-anchor="middle" font-size="10" fill="#888" font-style="italic">e.g. house price</text>

  <!-- Classification -->
  <rect x="245" y="20" width="190" height="180" rx="8" fill="#FAFAF8" stroke="#888780" stroke-width="1"/>
  <line x1="270" y1="170" x2="415" y2="170" stroke="#999" stroke-width="1"/>
  <line x1="270" y1="170" x2="270" y2="45" stroke="#999" stroke-width="1"/>
  <line x1="270" y1="105" x2="415" y2="105" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="290" cy="130" r="4" fill="#378ADD"/>
  <circle cx="305" cy="150" r="4" fill="#378ADD"/>
  <circle cx="320" cy="140" r="4" fill="#378ADD"/>
  <circle cx="330" cy="160" r="4" fill="#378ADD"/>
  <rect x="356" y="72" width="8" height="8" fill="#EF9F27" transform="rotate(45 360 76)"/>
  <rect x="380" y="60" width="8" height="8" fill="#EF9F27" transform="rotate(45 384 64)"/>
  <rect x="395" y="80" width="8" height="8" fill="#EF9F27" transform="rotate(45 399 84)"/>
  <rect x="368" y="90" width="8" height="8" fill="#EF9F27" transform="rotate(45 372 94)"/>
  <text x="340" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#222">Classification</text>
  <text x="340" y="232" text-anchor="middle" font-size="10.5" fill="#666">Predicts a category</text>
  <text x="340" y="246" text-anchor="middle" font-size="10.5" fill="#666">or class label</text>
  <text x="340" y="264" text-anchor="middle" font-size="10" fill="#888" font-style="italic">e.g. spam vs. not spam</text>

  <!-- Clustering -->
  <rect x="470" y="20" width="190" height="180" rx="8" fill="#FAFAF8" stroke="#888780" stroke-width="1"/>
  <ellipse cx="510" cy="140" rx="30" ry="24" fill="#1D9E75" opacity="0.15" stroke="#1D9E75" stroke-dasharray="3 2"/>
  <circle cx="500" cy="135" r="4" fill="#1D9E75"/>
  <circle cx="515" cy="145" r="4" fill="#1D9E75"/>
  <circle cx="508" cy="150" r="4" fill="#1D9E75"/>
  <ellipse cx="600" cy="80" rx="30" ry="24" fill="#D4537E" opacity="0.15" stroke="#D4537E" stroke-dasharray="3 2"/>
  <circle cx="590" cy="75" r="4" fill="#D4537E"/>
  <circle cx="605" cy="85" r="4" fill="#D4537E"/>
  <circle cx="598" cy="90" r="4" fill="#D4537E"/>
  <ellipse cx="590" cy="155" rx="26" ry="20" fill="#7F77DD" opacity="0.15" stroke="#7F77DD" stroke-dasharray="3 2"/>
  <circle cx="580" cy="150" r="4" fill="#7F77DD"/>
  <circle cx="595" cy="160" r="4" fill="#7F77DD"/>
  <text x="565" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#222">Clustering</text>
  <text x="565" y="232" text-anchor="middle" font-size="10.5" fill="#666">Groups similar points,</text>
  <text x="565" y="246" text-anchor="middle" font-size="10.5" fill="#666">no labels given</text>
  <text x="565" y="264" text-anchor="middle" font-size="10" fill="#888" font-style="italic">e.g. customer segments</text>

  <text x="340" y="285" text-anchor="middle" font-size="12" fill="#555">Regression &amp; classification = supervised (labeled data) · Clustering = unsupervised</text>
</svg>
