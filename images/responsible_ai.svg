<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="230" fill="#ffffff"/>

  <!-- 6 pillar boxes, 3x2 grid -->
  <g>
    <rect x="20" y="20" width="200" height="80" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="120" y="45" text-anchor="middle" font-size="13" font-weight="600" fill="#042C53">⚖ Fairness</text>
    <text x="120" y="65" text-anchor="middle" font-size="10.5" fill="#0C447C">No biased outcomes</text>
    <text x="120" y="80" text-anchor="middle" font-size="10.5" fill="#0C447C">across groups</text>
  </g>

  <g>
    <rect x="240" y="20" width="200" height="80" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <text x="340" y="45" text-anchor="middle" font-size="13" font-weight="600" fill="#173404">🛡 Reliability &amp; safety</text>
    <text x="340" y="65" text-anchor="middle" font-size="10.5" fill="#27500A">Consistent, tested</text>
    <text x="340" y="80" text-anchor="middle" font-size="10.5" fill="#27500A">for edge cases</text>
  </g>

  <g>
    <rect x="460" y="20" width="200" height="80" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="560" y="45" text-anchor="middle" font-size="13" font-weight="600" fill="#4A1B0C">🔒 Privacy &amp; security</text>
    <text x="560" y="65" text-anchor="middle" font-size="10.5" fill="#712B13">Protect data,</text>
    <text x="560" y="80" text-anchor="middle" font-size="10.5" fill="#712B13">secure the system</text>
  </g>

  <g>
    <rect x="20" y="115" width="200" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="120" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">🌍 Inclusiveness</text>
    <text x="120" y="160" text-anchor="middle" font-size="10.5" fill="#085041">Usable by everyone,</text>
    <text x="120" y="175" text-anchor="middle" font-size="10.5" fill="#085041">all abilities</text>
  </g>

  <g>
    <rect x="240" y="115" width="200" height="80" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
    <text x="340" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#4B1528">🔍 Transparency</text>
    <text x="340" y="160" text-anchor="middle" font-size="10.5" fill="#72243E">Users understand</text>
    <text x="340" y="175" text-anchor="middle" font-size="10.5" fill="#72243E">why a decision was made</text>
  </g>

  <g>
    <rect x="460" y="115" width="200" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="560" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">👤 Accountability</text>
    <text x="560" y="160" text-anchor="middle" font-size="10.5" fill="#444441">Humans remain</text>
    <text x="560" y="175" text-anchor="middle" font-size="10.5" fill="#444441">responsible for outcomes</text>
  </g>

  <text x="340" y="218" text-anchor="middle" font-size="12" fill="#555" font-weight="600">Microsoft's six Responsible AI principles</text>
</svg>
