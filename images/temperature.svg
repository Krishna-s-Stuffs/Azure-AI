<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="290" fill="#ffffff"/>

  <rect x="30" y="20" width="280" height="30" rx="8" fill="#B5D4F4"/>
  <text x="170" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#042C53">Low temperature (e.g. 0.2)</text>

  <line x1="50" y1="110" x2="270" y2="110" stroke="#888" stroke-width="1"/>
  <rect x="60" y="102" width="24" height="8" fill="#B4B2A9"/>
  <rect x="100" y="65" width="24" height="45" fill="#378ADD"/>
  <rect x="140" y="107" width="24" height="3" fill="#B4B2A9"/>
  <rect x="180" y="108" width="24" height="2" fill="#B4B2A9"/>
  <rect x="220" y="109" width="24" height="1" fill="#B4B2A9"/>
  <text x="170" y="135" text-anchor="middle" font-size="12" fill="#444">One token dominates the choice</text>
  <text x="170" y="152" text-anchor="middle" font-size="12" fill="#444">→ deterministic, focused, repeatable</text>

  <rect x="370" y="20" width="280" height="30" rx="8" fill="#F5C4B3"/>
  <text x="510" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#4A1B0C">High temperature (e.g. 1.2)</text>

  <line x1="390" y1="110" x2="610" y2="110" stroke="#888" stroke-width="1"/>
  <rect x="400" y="85" width="24" height="25" fill="#D85A30" opacity="0.5"/>
  <rect x="440" y="75" width="24" height="35" fill="#D85A30" opacity="0.7"/>
  <rect x="480" y="90" width="24" height="20" fill="#D85A30" opacity="0.5"/>
  <rect x="520" y="80" width="24" height="30" fill="#D85A30" opacity="0.6"/>
  <rect x="560" y="95" width="24" height="15" fill="#D85A30" opacity="0.4"/>
  <text x="510" y="135" text-anchor="middle" font-size="12" fill="#444">Probability spread across many tokens</text>
  <text x="510" y="152" text-anchor="middle" font-size="12" fill="#444">→ varied, creative, less predictable</text>

  <line x1="30" y1="180" x2="650" y2="180" stroke="#ddd" stroke-width="1"/>
  <text x="170" y="205" text-anchor="middle" font-size="12" fill="#555">Good for: factual Q&amp;A, code, structured output</text>
  <text x="510" y="205" text-anchor="middle" font-size="12" fill="#555">Good for: brainstorming, creative writing, variety</text>

  <line x1="60" y1="245" x2="620" y2="245" stroke="#333" stroke-width="1.5"/>
  <circle cx="60" cy="245" r="5" fill="#378ADD"/>
  <circle cx="620" cy="245" r="5" fill="#D85A30"/>
  <text x="60" y="268" text-anchor="middle" font-size="11" fill="#555">0.0</text>
  <text x="620" y="268" text-anchor="middle" font-size="11" fill="#555">2.0</text>
  <text x="340" y="268" text-anchor="middle" font-size="12" fill="#555" font-weight="600">temperature scale</text>
</svg>
