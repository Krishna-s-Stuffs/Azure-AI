<svg xmlns="http://www.w3.org/2000/svg" width="680" height="150" viewBox="0 0 680 150" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="150" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="90" y="53" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C">Browse catalog</text>
  <text x="90" y="70" text-anchor="middle" font-size="11" fill="#3C3489">Pick a model</text>
  <line x1="160" y1="58" x2="185" y2="58" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="188" y="30" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="258" y="53" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C">Deploy model</text>
  <text x="258" y="70" text-anchor="middle" font-size="11" fill="#3C3489">To an endpoint</text>
  <line x1="328" y1="58" x2="353" y2="58" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="356" y="30" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="426" y="53" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C">Test in playground</text>
  <text x="426" y="70" text-anchor="middle" font-size="11" fill="#3C3489">Tune parameters</text>
  <line x1="496" y1="58" x2="521" y2="58" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="524" y="30" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="594" y="53" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C">Iterate prompt</text>
  <text x="594" y="70" text-anchor="middle" font-size="11" fill="#3C3489">Refine &amp; repeat</text>

  <text x="340" y="118" text-anchor="middle" font-size="12" fill="#555">↻ Steps 3–4 repeat until the model behaves as intended</text>
</svg>
