<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="300" fill="#ffffff"/>

  <!-- Panel 1: Image classification -->
  <rect x="20" y="30" width="190" height="150" rx="8" fill="#FAFAF8" stroke="#888780" stroke-width="1"/>
  <ellipse cx="75" cy="120" rx="30" ry="22" fill="#BA7517" opacity="0.55"/>
  <circle cx="65" cy="102" r="8" fill="#BA7517" opacity="0.55"/>
  <circle cx="88" cy="102" r="8" fill="#BA7517" opacity="0.55"/>
  <ellipse cx="150" cy="130" rx="34" ry="26" fill="#5F5E5A" opacity="0.5"/>
  <circle cx="138" cy="108" r="9" fill="#5F5E5A" opacity="0.5"/>
  <circle cx="164" cy="108" r="9" fill="#5F5E5A" opacity="0.5"/>
  <rect x="20" y="190" width="190" height="30" rx="6" fill="#9FE1CB"/>
  <text x="115" y="209" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">"cat and dog"</text>
  <text x="115" y="245" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Image classification</text>
  <text x="115" y="263" text-anchor="middle" font-size="11" fill="#666">One label for the whole image</text>

  <!-- Panel 2: Object detection -->
  <rect x="245" y="30" width="190" height="150" rx="8" fill="#FAFAF8" stroke="#888780" stroke-width="1"/>
  <ellipse cx="300" cy="120" rx="30" ry="22" fill="#BA7517" opacity="0.55"/>
  <circle cx="290" cy="102" r="8" fill="#BA7517" opacity="0.55"/>
  <circle cx="313" cy="102" r="8" fill="#BA7517" opacity="0.55"/>
  <ellipse cx="375" cy="130" rx="34" ry="26" fill="#5F5E5A" opacity="0.5"/>
  <circle cx="363" cy="108" r="9" fill="#5F5E5A" opacity="0.5"/>
  <circle cx="389" cy="108" r="9" fill="#5F5E5A" opacity="0.5"/>
  <rect x="258" y="86" width="60" height="52" fill="none" stroke="#D85A30" stroke-width="2" rx="2"/>
  <rect x="258" y="73" width="34" height="14" fill="#D85A30" rx="2"/>
  <text x="275" y="84" text-anchor="middle" font-size="9" fill="white" font-weight="600">cat</text>
  <rect x="338" y="92" width="76" height="60" fill="none" stroke="#0F6E56" stroke-width="2" rx="2"/>
  <rect x="338" y="79" width="38" height="14" fill="#0F6E56" rx="2"/>
  <text x="357" y="90" text-anchor="middle" font-size="9" fill="white" font-weight="600">dog</text>
  <text x="340" y="245" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Object detection</text>
  <text x="340" y="263" text-anchor="middle" font-size="11" fill="#666">Bounding box + label per object</text>

  <!-- Panel 3: Semantic segmentation -->
  <rect x="470" y="30" width="190" height="150" rx="8" fill="#5DCAA5" opacity="0.25" stroke="#888780" stroke-width="1"/>
  <path d="M525 90 Q525 68 552 68 Q579 68 579 90 Q590 95 585 112 L585 142 Q585 158 552 158 Q519 158 519 142 L519 112 Q514 95 525 90 Z" fill="#F0997B" opacity="0.9"/>
  <path d="M600 98 Q600 74 631 74 Q662 74 662 98 L662 150 Q662 166 631 166 Q600 166 600 150 Z" fill="#7F77DD" opacity="0.9"/>
  <rect x="470" y="30" width="190" height="150" rx="8" fill="none" stroke="#888780" stroke-width="1"/>
  <text x="565" y="245" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Semantic segmentation</text>
  <text x="565" y="263" text-anchor="middle" font-size="11" fill="#666">Every pixel classified</text>

  <text x="340" y="292" text-anchor="middle" font-size="12" fill="#555">Increasing precision: classification → detection → segmentation</text>
</svg>
